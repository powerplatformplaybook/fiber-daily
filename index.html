function setCounter(){document.querySelector('#counter').textContent=fmt(total())+' g'}
function go(s){screen=s;query='';render();scrollTo(0,0)}
function render(){setCounter(); const v=document.querySelector('#view'); if(screen==='home')v.innerHTML=home(); if(screen==='select')v.innerHTML=selectView(); if(screen==='quantity')v.innerHTML=quantityView(); if(screen==='summary')v.innerHTML=summaryView(); if(screen==='history')v.innerHTML=historyView(); if(screen==='custom')v.innerHTML=customView(); bind()}
function home(){let t=db.logs[today()], recent=Object.keys(db.logs).sort().reverse().slice(0,5);return `<section class="card hero"><div class="small">TODAY</div><h1>${fmt(total(t?.items||{}))} g</h1><p>${t?'Your saved fiber total':'Ready to begin your daily log?'}</p><button class="btn secondary" data-act="start">${t?'Continue today’s log':'Start today’s log'}</button></section><div class="grid"><button class="card btn ghost" data-go="history">View previous days</button><button class="card btn ghost" data-go="custom">Add custom food</button></div><section class="card"><div class="row spread"><h2>Recent days</h2><span class="muted small">Saved on this device</span></div>${recent.length?recent.map(k=>`<div class="history" data-open="${k}"><span>${dateLabel(k)}</span><strong>${fmt(total(db.logs[k].items))} g</strong></div>`).join(''):'<div class="empty muted">No saved days yet.</div>'}</section><p class="small muted">Food values and standard portions are based on the attached USDA fiber source list. Your entries stay in this browser.</p>`}
function selectView(){let cat=CATS[catIndex], foods=allFoods().filter(f=>f.category===cat).filter(f=>filter==='all'||db.favorites.includes(f.id)).filter(f=>f.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(db.favorites.includes(b.id)-db.favorites.includes(a.id))||a.name.localeCompare(b.name));return `<section class="card"><div class="small muted">SECTION ${catIndex+1} OF ${CATS.length}</div><h1>${cat}</h1><div class="bar"><span style="width:${(catIndex+1)/CATS.length*100}%"></span></div></section><input class="search" id="search" placeholder="Search ${cat.toLowerCase()}" value="${esc(query)}" aria-label="Search foods"><div class="tabs"><button class="tab ${filter==='all'?'active':''}" data-filter="all">All foods</button><button class="tab ${filter==='fav'?'active':''}" data-filter="fav">★ Favorites</button></div><div id="foods">${foods.length?foods.map(foodCard).join(''):'<div class="card empty muted">No foods match this view.</div>'}</div><div class="footer"><button class="btn secondary" data-act="back">${catIndex?'Back':'Home'}</button><button class="btn" data-act="next">${catIndex===CATS.length-1?'Set amounts':'Next section'}</button></div>`}
function foodCard(f){let sel=!!draft[f.id], fav=db.favorites.includes(f.id);return `<div class="card food ${sel?'selected':''}"><input class="check" type="checkbox" data-food="${f.id}" ${sel?'checked':''} aria-label="Select ${esc(f.name)}"><label><strong>${esc(f.name)}</strong><div class="muted small">${esc(f.portion)} · ${fmt(f.fiber)} g fiber</div></label><button class="star ${fav?'on':''}" data-star="${f.id}" aria-label="Favorite ${esc(f.name)}">${fav?'★':'☆'}</button></div>`}
function quantityView(){let items=Object.values(draft);return `<section class="card"><div class="small muted">AMOUNTS</div><h1>How much did you eat?</h1><p class="muted">Enter the number of standard portions. Decimals such as 0.5 or 1.5 are allowed.</p></section>${items.length?items.map(x=>`<div class="card qty"><div><strong>${esc(x.name)}</strong><div class="muted small">1 portion = ${esc(x.portion)} · ${fmt(x.fiber)} g</div><div class="small"><strong>${fmt(x.qty*x.fiber)} g</strong> fiber</div></div><label><span class="small muted">Portions</span><input type="number" min="0" max="50" step="0.25" value="${x.qty}" data-qty="${x.id}"></label></div>`).join(''):'<div class="card empty">You have not selected any foods.</div>'}<div class="footer"><button class="btn secondary" data-act="returnSelect">Back</button><button class="btn" data-act="review">Review total</button></div>`}
function summaryView(){let items=Object.values(draft), by=CATS.map(c=>[c,items.filter(x=>x.category===c).reduce((s,x)=>s+x.qty*x.fiber,0)]).filter(x=>x[1]>0);return `<section class="card hero"><div class="small">DAILY TOTAL</div><h1>${fmt(total())} g</h1><p>${items.length} food${items.length===1?'':'s'} logged</p></section><section class="card"><h2>By category</h2>${by.map(([c,n])=>`<div class="history"><span>${c}</span><strong>${fmt(n)} g</strong></div>`).join('')||'<div class="muted">No foods selected.</div>'}</section><section class="card"><h2>Foods logged</h2>${items.map(x=>`<div class="history"><span><strong>${esc(x.name)}</strong><br><span class="muted small">${x.qty} × ${esc(x.portion)}</span></span><strong>${fmt(x.qty*x.fiber)} g</strong></div>`).join('')||'<div class="muted">No foods selected.</div>'}</section><div class="row"><button class="btn secondary" data-act="editQty">Edit amounts</button><button class="btn" data-act="saveLog">Save today’s log</button></div>`}
function historyView(){let days=Object.keys(db.logs).sort().reverse();return `<section class="card"><div class="row spread"><div><div class="small muted">HISTORY</div><h1>Previous days</h1></div><button class="btn secondary" data-go="home">Home</button></div>${days.length?days.map(k=>`<div class="history" data-open="${k}"><span>${dateLabel(k)}</span><strong>${fmt(total(db.logs[k].items))} g</strong></div>`).join(''):'<div class="empty muted">Your saved logs will appear here.</div>'}</section>`}
function customView(){return `<section class="card"><div class="small muted">CUSTOM FOOD</div><h1>Add your own item</h1><form id="customForm"><label class="field">Food name<input name="name" required maxlength="80"></label><label class="field">Category<select name="category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field">Standard portion<input name="portion" placeholder="Example: 1 slice" required maxlength="40"></label><label class="field">Fiber per portion (g)<input name="fiber" type="number" min="0" max="100" step="0.1" required></label><label class="row"><input name="favorite" type="checkbox" checked> Add to favorites</label><p id="formMsg" class="notice hidden" aria-live="polite"></p><div class="row" style="margin-top:18px"><button type="button" class="btn secondary" data-go="home">Cancel</button><button class="btn" type="submit">Save food</button></div></form></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{draft=structuredClone(db.logs[b.dataset.open].items);go('summary')});let s=document.querySelector('#search');if(s)s.oninput=e=>{query=e.target.value;render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let id=b.dataset.star;db.favorites=db.favorites.includes(id)?db.favorites.filter(x=>x!==id):[...db.favorites,id];save();render()});document.querySelectorAll('[data-food]').forEach(c=>c.onchange=()=>{let f=allFoods().find(x=>x.id===c.dataset.food);if(c.checked)draft[f.id]={...f,qty:draft[f.id]?.qty||1};else delete draft[f.id];render()});document.querySelectorAll('[data-qty]').forEach(i=>i.oninput=()=>{let n=Math.max(0,Math.min(50,Number(i.value)||0));draft[i.dataset.qty].qty=n;setCounter();let card=i.closest('.qty');card.querySelector('.small strong').textContent=fmt(n*draft[i.dataset.qty].fiber)+' g'});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));let form=document.querySelector('#customForm');if(form)form.onsubmit=e=>{e.preventDefault();let fd=new FormData(form),name=fd.get('name').trim(),fiber=Number(fd.get('fiber'));if(!name||!Number.isFinite(fiber)||fiber<0){let m=document.querySelector('#formMsg');m.textContent='Enter a food name and a valid fiber amount.';m.classList.remove('hidden');return}let id='custom-'+Date.now();let f={id,name,category:fd.get('category'),portion:fd.get('portion').trim(),fiber,custom:true};db.custom.push(f);if(fd.get('favorite'))db.favorites.push(id);save();go('home')}}
function act(a){if(a==='start'){draft=structuredClone(db.logs[today()]?.items||{});catIndex=0;filter='all';go('select')}if(a==='back'){if(catIndex>0){catIndex--;render()}else go('home')}if(a==='next'){if(catIndex<CATS.length-1){catIndex++;query='';render()}else go('quantity')}if(a==='returnSelect'){catIndex=CATS.length-1;go('select')}if(a==='review')go('summary');if(a==='editQty')go('quantity');if(a==='saveLog'){db.logs[today()]={date:today(),items:structuredClone(draft),updated:new Date().toISOString()};save();go('home')}}
render();
</script></div>
</body>
</html>
